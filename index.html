<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Scout | Football Talent Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-bar:focus {
            border-color: var(--accent-color);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .player-tag {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .player-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 220px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 10px;
            border-radius: 8px;
        }

        .stat-item .val {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.1rem;
        }

        .stat-item .lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>NEXTGEN SCOUT</h1>
        <input type="text" id="searchInput" class="search-bar" placeholder="Search position, role, or tag..." onkeyup="filterCards()">
    </header>

    <main class="dashboard-grid" id="playerGrid">
        
        <!-- Player Card 1 -->
        <div class="player-card">
            <div class="player-header">
                <span class="player-name">Prospect #101</span>
                <span class="player-tag">Attacking Mid</span>
            </div>
            <div class="player-meta">
                <span>Age: 17</span>
                <span>Foot: Right</span>
                <span>Role: Playmaker</span>
            </div>
            <div class="chart-container">
                <canvas id="radar1"></canvas>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><div class="val">88</div><div class="lbl">Passing</div></div>
                <div class="stat-item"><div class="val">84</div><div class="lbl">Vision</div></div>
                <div class="stat-item"><div class="val">81</div><div class="lbl">Dribbling</div></div>
            </div>
        </div>

        <!-- Player Card 2 -->
        <div class="player-card">
            <div class="player-header">
                <span class="player-name">Prospect #102</span>
                <span class="player-tag">Inside Forward</span>
            </div>
            <div class="player-meta">
                <span>Age: 16</span>
                <span>Foot: Left</span>
                <span>Role: Winger</span>
            </div>
            <div class="chart-container">
                <canvas id="radar2"></canvas>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><div class="val">91</div><div class="lbl">Pace</div></div>
                <div class="stat-item"><div class="val">86</div><div class="lbl">Agility</div></div>
                <div class="stat-item"><div class="val">79</div><div class="lbl">Finishing</div></div>
            </div>
        </div>

    </main>

    <script>
        const radarOptions = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                r: {
                    angleLines: { color: '#334155' },
                    grid: { color: '#334155' },
                    pointLabels: { color: '#94a3b8', font: { size: 10 } },
                    ticks: { display: false, backdropColor: 'transparent' },
                    suggestedMin: 50,
                    suggestedMax: 100
                }
            },
            plugins: { legend: { display: false } }
        };

        // Radar Chart 1
        new Chart(document.getElementById('radar1'), {
            type: 'radar',
            data: {
                labels: ['Pace', 'Shooting', 'Passing', 'Dribbling', 'Defending', 'Physical'],
                datasets: [{
                    data: [78, 80, 88, 85, 55, 72],
                    backgroundColor: 'rgba(56, 189, 248, 0.2)',
                    borderColor: '#38bdf8',
                    pointBackgroundColor: '#38bdf8'
                }]
            },
            options: radarOptions
        });

        // Radar Chart 2
        new Chart(document.getElementById('radar2'), {
            type: 'radar',
            data: {
                labels: ['Pace', 'Shooting', 'Passing', 'Dribbling', 'Defending', 'Physical'],
                datasets: [{
                    data: [91, 79, 75, 86, 42, 68],
                    backgroundColor: 'rgba(56, 189, 248, 0.2)',
                    borderColor: '#38bdf8',
                    pointBackgroundColor: '#38bdf8'
                }]
            },
            options: radarOptions
        });

        // Search Filter
        function filterCards() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('player-card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "flex" : "none";
            }
        }
    </script>
</body>
</html>
